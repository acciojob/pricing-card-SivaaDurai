
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Card</title>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            background-color: #f5f5f5;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            margin: 30px auto;
        }

        img {
            width: 100%;
        }

        h1 {
            font-size: 24px;
        }

        p {
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://placehold.co/300x200" alt="Product image">
        <h1>Product Name</h1>
        <p>Price: ₹999</p>
        <p>This is a great product with excellent quality and features.</p>
        <button>Buy Now</button>
    </div>
</body>
</html>
